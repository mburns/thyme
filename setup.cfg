[metadata]
name = thyme
version = 0.1.0
description = A beautiful timeline app using TimelineJS3, htmx, and SQLite.
author = Your Name
license = MIT

[options]
packages = find:
include_package_data = True
python_requires = >=3.8
install_requires =
    Flask==2.3.3
    Flask-SQLAlchemy==3.0.5
    python-dotenv==1.0.0

[options.package_data]
* = templates/*.html, static/css/*.css

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,venv,build,dist 