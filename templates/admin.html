{% extends "base.html" %}

{% block title %}Admin - Timeline App{% endblock %}

{% block content %}
<div class="admin-container">
    <h1>Timeline Event Management</h1>
    
    <div class="admin-grid">
        <!-- Add Event Form -->
        <div class="form-section">
            <h2>Add New Event</h2>
            <form hx-post="/api/events" hx-target="#events-list" hx-swap="outerHTML">
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" name="title" required>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3"></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="start_date">Start Date *</label>
                        <input type="date" id="start_date" name="start_date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="end_date">End Date</label>
                        <input type="date" id="end_date" name="end_date">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="media_url">Media URL</label>
                    <input type="url" id="media_url" name="media_url" placeholder="https://example.com/image.jpg">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="media_caption">Media Caption</label>
                        <input type="text" id="media_caption" name="media_caption">
                    </div>
                    
                    <div class="form-group">
                        <label for="media_credit">Media Credit</label>
                        <input type="text" id="media_credit" name="media_credit">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="group">Group</label>
                    <input type="text" id="group" name="group" placeholder="e.g., Personal, Work, Travel">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="background_color">Background Color</label>
                        <input type="color" id="background_color" name="background_color" value="#ffffff">
                    </div>
                    
                    <div class="form-group">
                        <label for="text_color">Text Color</label>
                        <input type="color" id="text_color" name="text_color" value="#000000">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Add Event</button>
            </form>
        </div>
        
        <!-- Events List -->
        <div class="events-section">
            <h2>Current Events</h2>
            <div id="events-list" hx-get="/api/events" hx-trigger="load">
                <!-- Events will be loaded here -->
            </div>
        </div>
    </div>
</div>
{% endblock %}
