<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Thyme IMDB{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <header>
        <h1><a href="/">Thyme IMDB</a></h1>
        <nav>
            <ul class="nav-links">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/about.html">About</a></li>
                <li><a href="/movies.html">Movies</a></li>
                <li><a href="/tv.html">TV</a></li>
                <li><a href="/persons.html">People</a></li>
                <li><a href="/genres.html">Genres</a></li>
                <li><a href="/top-rated.html">Top Rated</a></li>
                <li><a href="/videogame.html">Video Games</a></li>
                <li><a href="/search.html">Search</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Powered by <a href="https://trailbase.io">TrailBase</a>, and Alpine.js. <a href="https://datasets.imdbws.com/"></a>Data from IMDB</a>.</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
