{% extends "_base.html" %}

{% block title %}Person Details | Thyme IMDB{% endblock %}

{% block content %}
<div x-data="{
    id: window.location.hash.substring(1),
    details: null,
    filmography: [],
    isLoading: true,

    fetchData() {
        // Fetch person details
        fetch(`/api/records/v1/persons/${this.id}`)
            .then(res => res.json())
            .then(data => { this.details = data; });

        // Fetch filmography
        const filmographyUrl = `/api/records/v1/v_person_titles?filter[person_id][$eq]=${this.id}&order=-startYear`;
        fetch(filmographyUrl)
            .then(res => res.json())
            .then(data => { this.filmography = data.records; });

        this.isLoading = false;
    }
}" x-init="fetchData()">

    <p x-show="isLoading">Loading person details...</p>

    <template x-if="details">
        <div>
            <!-- Person Details -->
            <div class="person-details">
                <h1 x-text="details.primaryName"></h1>
                <p><strong>Born:</strong> <span x-text="details.birthYear || 'N/A'"></span></p>
                <p x-show="details.deathYear"><strong>Died:</strong> <span x-text="details.deathYear"></span></p>
                <p><strong>Professions:</strong> <span x-text="details.primaryProfession"></span></p>
            </div>

            <!-- Filmography -->
            <div class="filmography-section" x-show="filmography.length > 0">
                <h2>Filmography</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Year</th>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Role</th>
                            <th>Characters</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="f in filmography" :key="f.title_id">
                            <tr>
                                <td x-text="f.startYear"></td>
                                <td><a :href="'/title.html#' + f.title_id" x-text="f.primaryTitle"></a></td>
                                <td x-text="f.titleType"></td>
                                <td x-text="f.category" class="capitalize"></td>
                                <td x-text="JSON.parse(f.characters || '[]').join(', ')"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </template>
</div>
{% endblock %}
